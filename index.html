<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- PeerJS handles WebRTC signaling — no backend server needed -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #FF2D78;
      --pink-dark: #d4215f;
      --bg: #0a0a0a;
      --glass: rgba(20, 20, 30, 0.75);
      --glass-border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.55);
      --radius: 14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── JOIN SCREEN ─────────────────────────────────── */
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 60%, #1a0a2e 0%, #0a0a0a 70%);
      padding: 24px;
    }

    #join-screen h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #join-screen p {
      color: var(--text-dim);
      font-size: 0.95rem;
      text-align: center;
      max-width: 340px;
      line-height: 1.6;
    }

    .join-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    .join-card label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
      margin-bottom: 6px;
    }

    .join-card input,
    .join-card select {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 13px 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .join-card input:focus,
    .join-card select:focus { border-color: var(--pink); }

    .join-card select option { background: #1a1a2e; color: #fff; }

    #join-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--pink), #c720a8);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(255,45,120,0.4);
      letter-spacing: 0.3px;
    }

    #join-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 32px rgba(255,45,120,0.55); }
    #join-btn:active { transform: translateY(0); }

    .join-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .join-hint span.dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--pink);
      flex-shrink: 0;
    }

    /* ─── CALL SCREEN ─────────────────────────────────── */
    #call-screen {
      display: none;
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #remote-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    /* Waiting overlay */
    #waiting-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(ellipse at 50% 50%, #1a0a2e 0%, #050508 80%);
      z-index: 5;
      transition: opacity 0.5s;
    }

    #waiting-overlay.hidden { opacity: 0; pointer-events: none; }

    .waiting-pulse {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,45,120,0.15);
      display: flex; align-items: center; justify-content: center;
      animation: pulse-ring 2s ease-in-out infinite;
    }

    .waiting-pulse svg { width: 36px; height: 36px; fill: var(--pink); }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,120,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(255,45,120,0); }
    }

    #waiting-overlay p { color: var(--text-dim); font-size: 1rem; }

    #waiting-overlay strong {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }

    #waiting-room-code {
      display: inline-block;
      background: rgba(255,45,120,0.15);
      border: 1px solid rgba(255,45,120,0.3);
      border-radius: 8px;
      padding: 4px 14px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--pink);
    }

    /* Self-view PiP — top right (larger) */
    #self-video-container {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 220px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
      z-index: 20;
      background: #1a1a1a;
    }

    #self-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Mic toggle — sits inside the PiP corner */
    #btn-mic {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      z-index: 25;
    }

    /* Speaker toggle — top left */
    #btn-speaker {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 25;
    }

    /* Mirror toggle — appears on hover over the remote video area */
    #btn-mirror {
      position: absolute;
      top: 188px; /* just below the PiP (16px + 160px + 12px) */
      right: 16px;
      z-index: 25;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    #call-screen:hover #btn-mirror {
      opacity: 1;
      pointer-events: auto;
    }

    #btn-mirror.active {
      background: rgba(255,45,120,0.25);
      border-color: rgba(255,45,120,0.5);
    }

    /* Mirrored remote video */
    #remote-video.mirrored {
      transform: scaleX(-1);
    }

    /* Icon button base */
    .icon-btn {
      background: rgba(20,20,30,0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      flex-shrink: 0;
    }

    .icon-btn:hover { background: rgba(40,40,55,0.9); transform: scale(1.07); }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn.muted { background: rgba(255,45,120,0.25); border-color: rgba(255,45,120,0.5); }
    .icon-btn.muted svg { color: var(--pink); }

    .icon-btn svg {
      width: 20px; height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ─── CHAT PANEL ──────────────────────────────────── */
    #chat-panel {
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      max-height: 55%;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
      pointer-events: none;
      z-index: 15;
    }

    .translation-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: rgba(255,255,255,0.7);
      background: rgba(20,20,30,0.65);
      backdrop-filter: blur(8px);
      border-radius: 6px;
      padding: 3px 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      margin-bottom: 10px;
    }

    .translation-label span { color: var(--pink); }

    #messages-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: calc(55vh - 40px);
      scrollbar-width: none;
    }

    #messages-container::-webkit-scrollbar { display: none; }

    .msg-bubble {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(12, 12, 22, 0.52);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 75%;
      animation: bubble-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      pointer-events: auto;
    }

    @keyframes bubble-in {
      from { opacity: 0; transform: translateY(6px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-sender {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--pink);
      letter-spacing: 0.3px;
    }

    .msg-main {
      font-size: 0.92rem;
      font-weight: 500;
      color: #fff;
      line-height: 1.5;
    }

    .msg-original {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.42);
      font-weight: 400;
      line-height: 1.4;
      font-style: italic;
    }

    /* ─── BOTTOM BAR ──────────────────────────────────── */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.06);
      z-index: 30;
    }

    #msg-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 0 20px;
      caret-color: var(--pink);
    }

    #msg-input::placeholder { color: rgba(255,255,255,0.3); }

    #btn-send {
      height: 100%;
      padding: 0 32px;
      border: none;
      background: linear-gradient(135deg, var(--pink) 0%, #c720a8 100%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: filter 0.2s, transform 0.15s;
      flex-shrink: 0;
    }

    #btn-send:hover { filter: brightness(1.12); }
    #btn-send:active { transform: scale(0.98); }

    /* ─── END BUTTON ──────────────────────────────────── */
    #btn-end {
      position: absolute;
      bottom: 80px;
      right: 16px;
      z-index: 30;
      background: rgba(20,20,30,0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 22px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: background 0.2s, transform 0.15s;
    }

    #btn-end:hover { background: rgba(200,20,50,0.5); border-color: rgba(220,30,60,0.4); }
    #btn-end:active { transform: scale(0.97); }

    /* ─── TOAST ───────────────────────────────────────── */
    #toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(20,20,30,0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.85rem;
      color: var(--text-dim);
      z-index: 100;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ─── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 480px) {
      #self-video-container { width: 160px; height: 120px; }
      #btn-send { padding: 0 22px; font-size: 0.9rem; }
      .msg-bubble { max-width: 88%; }
    }
  </style>
</head>
<body>

<!-- ══════════════ JOIN SCREEN ══════════════ -->
<div id="join-screen">
  <h1>💌 Video Call</h1>
  <p>Enter the same room code on both devices to connect.</p>

  <div class="join-card">
    <div>
      <label for="room-input">Room Code</label>
      <input id="room-input" type="text" placeholder="e.g. sunshine123" autocomplete="off" spellcheck="false" />
    </div>
    <div>
      <label for="lang-select">Your Language</label>
      <select id="lang-select">
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Spanish (Español)</option>
      </select>
    </div>
    <button id="join-btn">Start Call</button>
    <div class="join-hint">
      <span class="dot"></span>
      Messages translate automatically between English &amp; Spanish
    </div>
  </div>
</div>

<!-- ══════════════ CALL SCREEN ══════════════ -->
<div id="call-screen">

  <!-- Remote video (background) -->
  <video id="remote-video" autoplay playsinline></video>

  <!-- Waiting for peer -->
  <div id="waiting-overlay">
    <div class="waiting-pulse">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.12-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
      </svg>
    </div>
    <div style="text-align:center">
      <strong>Waiting for the other person…</strong>
      <p style="margin-top:8px">Share your room code:</p>
      <div id="waiting-room-code"></div>
    </div>
  </div>

  <!-- Speaker button — top left -->
  <button id="btn-speaker" class="icon-btn" title="Toggle speaker" aria-label="Toggle speaker">
    <svg id="icon-speaker-on" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
    <svg id="icon-speaker-off" viewBox="0 0 24 24" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
  </button>

  <!-- Self-view PiP (larger) -->
  <div id="self-video-container">
    <video id="self-video" autoplay playsinline muted></video>
    <!-- Mic button inside PiP -->
    <button id="btn-mic" class="icon-btn" title="Toggle microphone" aria-label="Toggle microphone"
      style="position:absolute;top:8px;right:8px;width:34px;height:34px;">
      <svg id="icon-mic-on" viewBox="0 0 24 24" style="width:16px;height:16px;">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <svg id="icon-mic-off" viewBox="0 0 24 24" style="width:16px;height:16px;display:none">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>

  <!-- Mirror toggle — fades in on hover over the remote video -->
  <button id="btn-mirror" class="icon-btn" title="Mirror video" aria-label="Toggle mirror">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v18"/>
      <path d="M5 7l-3 2 3 2"/>
      <path d="M19 7l3 2-3 2"/>
      <rect x="2" y="6" width="6" height="12" rx="1"/>
      <rect x="16" y="6" width="6" height="12" rx="1"/>
    </svg>
  </button>

  <!-- Chat panel -->
  <div id="chat-panel">
    <div class="translation-label">Translation to <span id="translation-target-label">English</span></div>
    <div id="messages-container"></div>
  </div>

  <!-- End button (above bottom bar) -->
  <button id="btn-end">End</button>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <input id="msg-input" type="text" placeholder="Type your message…" autocomplete="off" spellcheck="false" />
    <button id="btn-send">Send</button>
  </div>

</div>

<!-- Toast notification -->
<div id="toast"></div>

<script>
  // ─── CONFIG ────────────────────────────────────────────────────────
  const MYMEMORY_URL = 'https://api.mymemory.translated.net/get';

  // ─── STATE ─────────────────────────────────────────────────────────
  let myLang     = 'en';
  let remoteLang = 'es';
  let roomCode   = '';
  let peer       = null;   // PeerJS instance
  let conn       = null;   // PeerJS DataConnection (chat)
  let call       = null;   // PeerJS MediaConnection (video/audio)
  let localStream = null;
  let isMicMuted     = false;
  let isSpeakerMuted = false;
  let isHost = false;      // true if we registered as host peer

  // ─── DOM ───────────────────────────────────────────────────────────
  const joinScreen     = document.getElementById('join-screen');
  const callScreen     = document.getElementById('call-screen');
  const roomInput      = document.getElementById('room-input');
  const langSelect     = document.getElementById('lang-select');
  const joinBtn        = document.getElementById('join-btn');
  const remoteVideo    = document.getElementById('remote-video');
  const selfVideo      = document.getElementById('self-video');
  const waitingOverlay = document.getElementById('waiting-overlay');
  const waitingCode    = document.getElementById('waiting-room-code');
  const msgInput       = document.getElementById('msg-input');
  const btnSend        = document.getElementById('btn-send');
  const btnEnd         = document.getElementById('btn-end');
  const btnMic         = document.getElementById('btn-mic');
  const btnSpeaker     = document.getElementById('btn-speaker');
  const messagesEl     = document.getElementById('messages-container');
  const translLabel    = document.getElementById('translation-target-label');
  const toastEl        = document.getElementById('toast');

  // ─── TOAST ─────────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg, duration = 2800) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  // ─── TRANSLATION ───────────────────────────────────────────────────
  async function translate(text, fromLang, toLang) {
    if (fromLang === toLang || !text.trim()) return text;
    try {
      const url = `${MYMEMORY_URL}?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (data.responseStatus === 200) return data.responseData.translatedText;
    } catch (e) { console.warn('Translation failed:', e); }
    return text;
  }

  // ─── CHAT BUBBLES ──────────────────────────────────────────────────
  function addMessage({ mainText, originalText, isSelf }) {
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${isSelf ? 'self' : 'other'}`;

    const senderEl = document.createElement('div');
    senderEl.className = 'msg-sender';
    senderEl.textContent = isSelf ? 'Me:' : 'Them:';

    const mainEl = document.createElement('div');
    mainEl.className = 'msg-main';
    mainEl.textContent = mainText;

    bubble.appendChild(senderEl);
    bubble.appendChild(mainEl);

    if (originalText && originalText !== mainText) {
      const origEl = document.createElement('div');
      origEl.className = 'msg-original';
      origEl.textContent = originalText;
      bubble.appendChild(origEl);
    }

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ─── SEND MESSAGE ──────────────────────────────────────────────────
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    if (!conn || !conn.open) {
      showToast('⏳ Not connected yet — waiting for the other person.');
      return;
    }

    msgInput.value = '';

    // Send { text, lang } to remote
    conn.send({ text, lang: myLang });

    // Show our message immediately (with a loading translation)
    addMessage({ mainText: text, originalText: '…translating', isSelf: true });

    // Then update with real translation
    const translated = await translate(text, myLang, remoteLang);
    // Update the last self bubble's original line
    const origEls = messagesEl.querySelectorAll('.msg-bubble.self .msg-original');
    if (origEls.length) origEls[origEls.length - 1].textContent = translated;
  }

  // ─── HANDLE INCOMING CHAT ──────────────────────────────────────────
  async function handleRemoteMessage(data) {
    const { text, lang: senderLang } = data;
    remoteLang = senderLang; // keep in sync
    const translated = await translate(text, senderLang, myLang);
    addMessage({ mainText: translated, originalText: text, isSelf: false });
  }

  // ─── SETUP DATA CONNECTION ─────────────────────────────────────────
  function setupConn(c) {
    conn = c;
    conn.on('data', handleRemoteMessage);
    conn.on('close', () => {
      showToast('Chat connection closed.');
    });
    conn.on('error', (e) => console.warn('Conn error:', e));
  }

  // ─── SETUP MEDIA CALL ──────────────────────────────────────────────
  function setupCall(c) {
    call = c;
    call.on('stream', (remoteStream) => {
      remoteVideo.srcObject = remoteStream;
      waitingOverlay.classList.add('hidden');
    });
    call.on('close', () => {
      waitingOverlay.classList.remove('hidden');
      remoteVideo.srcObject = null;
      showToast('Call ended by the other person.');
    });
    call.on('error', (e) => console.warn('Call error:', e));
  }

  // ─── PEERJS — CONNECT AS CALLER ────────────────────────────────────
  function connectAsCallerTo(hostId) {
    showToast('📞 Connecting…');
    // Media call
    const c = peer.call(hostId, localStream);
    setupCall(c);

    // Data channel
    const d = peer.connect(hostId, { reliable: true });
    d.on('open', () => {
      setupConn(d);
      showToast('💚 Connected!');
      waitingOverlay.classList.add('hidden');
    });
  }

  // ─── PEERJS — INIT ─────────────────────────────────────────────────
  function initPeer() {
    const hostPeerId = 'vc-' + roomCode; // stable host ID based on room code

    // Try to register as host
    peer = new Peer(hostPeerId, {
      // Uses PeerJS free cloud server (0.peerjs.com)
      debug: 0
    });

    peer.on('open', (id) => {
      isHost = true;
      waitingCode.textContent = roomCode;
      // Wait for incoming connections
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        // Host already exists — become the caller
        peer.destroy();
        peer = new Peer({ debug: 0 });
        peer.on('open', () => {
          isHost = false;
          connectAsCallerTo(hostPeerId);
        });
        peer.on('error', (e) => showToast('Connection error: ' + e.message));
      } else {
        showToast('Error: ' + err.message);
      }
    });

    // Host receives incoming connections
    peer.on('call', (incomingCall) => {
      incomingCall.answer(localStream);
      setupCall(incomingCall);
      showToast('💚 Connected!');
      waitingOverlay.classList.add('hidden');
    });

    peer.on('connection', (incomingConn) => {
      incomingConn.on('open', () => {
        setupConn(incomingConn);
      });
    });
  }

  // ─── START CALL ────────────────────────────────────────────────────
  async function startCall() {
    roomCode = roomInput.value.trim().toLowerCase().replace(/\s+/g, '');
    if (!roomCode) { showToast('Please enter a room code.'); return; }

    myLang     = langSelect.value;
    remoteLang = myLang === 'en' ? 'es' : 'en';
    updateTranslationLabel();

    joinBtn.textContent = 'Connecting…';
    joinBtn.disabled    = true;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      selfVideo.srcObject = localStream;
    } catch (e) {
      showToast('Camera/mic access denied.');
      joinBtn.textContent = 'Start Call';
      joinBtn.disabled    = false;
      return;
    }

    joinScreen.style.display  = 'none';
    callScreen.style.display  = 'block';
    waitingCode.textContent   = roomCode;

    initPeer();
    msgInput.focus();
  }

  // ─── END CALL ──────────────────────────────────────────────────────
  function endCall() {
    call && call.close();
    conn && conn.close();
    peer && peer.destroy();
    localStream && localStream.getTracks().forEach(t => t.stop());

    peer = null; call = null; conn = null; localStream = null;

    callScreen.style.display  = 'none';
    joinScreen.style.display  = 'flex';
    joinBtn.textContent       = 'Start Call';
    joinBtn.disabled          = false;
    messagesEl.innerHTML      = '';
    waitingOverlay.classList.remove('hidden');
    remoteVideo.srcObject     = null;
  }

  // ─── MIC TOGGLE ────────────────────────────────────────────────────
  function toggleMic() {
    isMicMuted = !isMicMuted;
    if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = !isMicMuted; });
    btnMic.classList.toggle('muted', isMicMuted);
    document.getElementById('icon-mic-on').style.display  = isMicMuted ? 'none' : '';
    document.getElementById('icon-mic-off').style.display = isMicMuted ? '' : 'none';
    showToast(isMicMuted ? '🔇 Mic muted' : '🎤 Mic on');
  }

  // ─── SPEAKER TOGGLE ────────────────────────────────────────────────
  function toggleSpeaker() {
    isSpeakerMuted = !isSpeakerMuted;
    remoteVideo.muted = isSpeakerMuted;
    btnSpeaker.classList.toggle('muted', isSpeakerMuted);
    document.getElementById('icon-speaker-on').style.display  = isSpeakerMuted ? 'none' : '';
    document.getElementById('icon-speaker-off').style.display = isSpeakerMuted ? '' : 'none';
    showToast(isSpeakerMuted ? '🔇 Speaker muted' : '🔊 Speaker on');
  }

  // ─── TRANSLATION LABEL ─────────────────────────────────────────────
  function updateTranslationLabel() {
    translLabel.textContent = myLang === 'en' ? 'English' : 'Español';
  }

  // ─── MIRROR TOGGLE ─────────────────────────────────────────────────
  let isRemoteMirrored = false;
  const btnMirror = document.getElementById('btn-mirror');

  function toggleMirror() {
    isRemoteMirrored = !isRemoteMirrored;
    remoteVideo.classList.toggle('mirrored', isRemoteMirrored);
    btnMirror.classList.toggle('active', isRemoteMirrored);
    showToast(isRemoteMirrored ? '🔄 Video mirrored' : '🔄 Mirror off');
  }

  // ─── EVENT LISTENERS ───────────────────────────────────────────────
  joinBtn.addEventListener('click', startCall);
  roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') startCall(); });
  btnSend.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  btnEnd.addEventListener('click', endCall);
  btnMic.addEventListener('click', toggleMic);
  btnSpeaker.addEventListener('click', toggleSpeaker);
  btnMirror.addEventListener('click', toggleMirror);
</script>
</body>
</html>
